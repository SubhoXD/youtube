<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M_K GAMER | Official Website</title><style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    overflow-x: hidden;
}

/* Navbar */

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 8%;
    background: #101010;
    border-bottom: 1px solid #292929;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #FFD700;
    letter-spacing: 2px;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    transition: 0.3s;
}

nav a:hover {
    color: gold;
}

/* Hero Section */

.hero {
    min-height: 85vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
}

.hero h1 {
    font-size: 55px;
    color: gold;
    letter-spacing: 4px;
    margin-bottom: 15px;
    text-shadow: 0 0 20px #FFD70055;
}

.hero p {
    color: #aaa;
    font-size: 17px;
    line-height: 1.7;
    max-width: 550px;
}

/* Buttons */

.buttons {
    margin-top: 35px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
}

.btn {
    display: inline-block;
    padding: 15px 30px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.35s ease;
    cursor: pointer;
}

.gold {
    background: linear-gradient(135deg, #FFD700, #B8860B);
    color: black;
    box-shadow: 0 0 15px #FFD70044;
}

.outline {
    border: 1px solid gold;
    color: gold;
}

.btn:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 25px #FFD70077;
}

/* Subscribe Mascot Animation */

.subscribe-wrap {
    position: relative;
    display: inline-block;
    z-index: 5;
}

.mascot {
    position: absolute;
    width: 145px;
    height: auto;
    right: -115px;
    bottom: -25px;

    opacity: 0;
    visibility: hidden;

    transform: translateX(-65px) scale(0.5);
    transform-origin: bottom left;

    transition: all 0.5s ease;

    pointer-events: none;
    z-index: 10;
}

/* Mascot appears on hover */

.subscribe-wrap:hover .mascot,
.subscribe-wrap:focus-within .mascot {
    opacity: 1;
    visibility: visible;
    transform: translateX(0) scale(1);
}

/* About Section */

.about {
    padding: 70px 20px;
    text-align: center;
    background: #111;
    border-top: 1px solid #292929;
}

.about h2 {
    color: gold;
    font-size: 30px;
    margin-bottom: 20px;
}

.about p {
    color: #aaa;
    line-height: 1.8;
    max-width: 600px;
    margin: auto;
}

/* Footer */

footer {
    text-align: center;
    padding: 25px;
    color: #777;
    border-top: 1px solid #292929;
}

footer span {
    color: gold;
}

/* GOLDEN CUSTOM MOUSE CURSOR */

.custom-cursor {
    width: 18px;
    height: 18px;
    background: #FFD700;
    border: 2px solid white;
    border-radius: 50%;
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px gold, 0 0 25px gold;
    display: none;
}

@media (hover: hover) and (pointer: fine) {
    body {
        cursor: none;
    }

    .custom-cursor {
        display: block;
    }
}

/* Mobile Responsive */

@media (max-width: 600px) {

    nav {
        padding: 18px 5%;
    }

    .logo {
        font-size: 19px;
    }

    nav a {
        margin-left: 10px;
        font-size: 13px;
    }

    .hero h1 {
        font-size: 38px;
    }

    .hero p {
        font-size: 15px;
    }

    .buttons {
        gap: 20px;
    }

    .btn {
        padding: 13px 20px;
        font-size: 13px;
    }

    .mascot {
        width: 105px;
        right: -65px;
        bottom: -100px;
    }

}

@media (prefers-reduced-motion: reduce) {
    .btn,
    .mascot {
        transition: none;
    }
}

</style></head><body><!-- CUSTOM CURSOR --><div class="custom-cursor"></div><
